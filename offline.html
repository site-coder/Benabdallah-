<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0616">
<title>لا يوجد اتصال بالإنترنت</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0B0616;color:#F3EEFF;font-family:Alexandria,Tahoma,"Segoe UI",system-ui,sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  svg{width:84px;height:84px;color:#F59E0B}
  h1{margin:0;font-size:22px;color:#F59E0B}
  p{margin:0;max-width:460px;line-height:1.9;color:#CFC4EA;font-size:15px}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  a,button{font:inherit;min-height:44px;padding:0 20px;border-radius:14px;border:1px solid #8B5CF6;background:#7E22CE;color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  a.alt{background:transparent;color:#F3EEFF}
  a:focus-visible,button:focus-visible{outline:2px solid #F59E0B;outline-offset:2px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.4a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/></svg>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>لم نتمكن من تحميل هذه الصفحة لأنها لم تُخزَّن على جهازك بعد. افتح المنصة مرة واحدة وأنت متصل لتُخزَّن ملفاتها، وبعدها تعمل أدواتها دون إنترنت.</p>
  <p>خرائطك المفاهيمية ومشاريعك محفوظة على جهازك ولن تضيع بسبب انقطاع الاتصال.</p>
  <div class="row">
    <button type="button" id="retry">إعادة المحاولة</button>
    <a class="alt" href="./index.html">فتح الصفحة الرئيسية</a>
  </div>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
